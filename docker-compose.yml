services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  ml-service:
    build:
      context: .
      dockerfile: Dockerfile.ml
    restart: unless-stopped
    ports:
      - "8000:8000"

  backend:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    environment:
      MONGO_URI: mongodb://mongo:27017/credit-risk-scoring
      ML_SERVICE_URL: http://ml-service:8000
      PORT: 5000
      NODE_ENV: production
      ALLOW_TRAINING: "false"
    depends_on:
      - mongo
      - ml-service
    ports:
      - "5000:5000"

  frontend:
    build:
      context: .
      dockerfile: client/Dockerfile
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  mongo-data:
